<div class="bg-white dark:bg-plomo-card border border-slate-200 dark:border-plomo-border shadow-xl rounded-2xl p-8 relative overflow-hidden transition-all duration-300">
  
  <!-- Encabezado de la Tarjeta -->
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-teal-500 text-white font-extrabold text-2xl shadow-md mb-3">
      Ω
    </div>
    <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
      Iniciar Sesión
    </h2>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
      UML Tracker System
    </p>
  </div>

  <!-- Alerta de Error -->
  @if (errorMessage()) {
    <div class="mb-4 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900/30 text-red-600 dark:text-red-400 text-xs flex items-center gap-2 animate-fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <!-- Formulario de Login -->
  <form (submit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5 uppercase tracking-wider">
        Correo
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
        <input 
          type="text" 
          name="username"
          [(ngModel)]="username"
          placeholder="Ej. admin@politicas.com"
          required
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-plomo-border bg-slate-50 dark:bg-plomo-hover text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm"
        />
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5 uppercase tracking-wider">
        Contraseña
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <input 
          type="password" 
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-plomo-border bg-slate-50 dark:bg-plomo-hover text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all text-sm"
        />
      </div>
    </div>

    <button 
      type="submit"
      class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-teal-500 hover:from-indigo-700 hover:to-teal-600 text-white font-semibold text-sm shadow-md shadow-indigo-500/10 hover:shadow-indigo-500/20 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
    >
      Entrar al Sistema
    </button>
  </form>

  <!-- Panel de Acceso Rápido para Pruebas (Excelente UX) -->
  <div class="mt-6 pt-6 border-t border-slate-200 dark:border-plomo-border">
    <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 text-center mb-3">
      Acceso Rápido de Prueba
    </span>
    <div class="grid grid-cols-2 gap-2">
      <button 
        (click)="quickLogin('admin')" 
        class="py-2 px-3 rounded-lg border border-slate-200 dark:border-plomo-border hover:bg-slate-50 dark:hover:bg-plomo-hover flex flex-col items-center justify-center transition-all group"
      >
        <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400">Admin</span>
        <span class="text-[9px] text-slate-400">Todo el acceso</span>
      </button>
      
      <button 
        (click)="quickLogin('diagramador')" 
        class="py-2 px-3 rounded-lg border border-slate-200 dark:border-plomo-border hover:bg-slate-50 dark:hover:bg-plomo-hover flex flex-col items-center justify-center transition-all group"
      >
        <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-teal-600 dark:group-hover:text-teal-400">Diagramador</span>
        <span class="text-[9px] text-slate-400">Crea políticas</span>
      </button>

      <button 
        (click)="quickLogin('funcionario')" 
        class="py-2 px-3 rounded-lg border border-slate-200 dark:border-plomo-border hover:bg-slate-50 dark:hover:bg-plomo-hover flex flex-col items-center justify-center transition-all group"
      >
        <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400">Funcionario</span>
        <span class="text-[9px] text-slate-400">Opera flujos</span>
      </button>

      <button 
        (click)="quickLogin('cliente')" 
        class="py-2 px-3 rounded-lg border border-slate-200 dark:border-plomo-border hover:bg-slate-50 dark:hover:bg-plomo-hover flex flex-col items-center justify-center transition-all group"
      >
        <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-slate-600 dark:group-hover:text-slate-400">Cliente</span>
        <span class="text-[9px] text-slate-400">Ver Dashboard</span>
      </button>
    </div>
  </div>

</div>
