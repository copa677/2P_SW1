<div class="bg-white dark:bg-plomo-card border border-slate-200 dark:border-plomo-border rounded-2xl shadow-sm flex flex-col h-[600px] transition-all duration-300">
  
  <!-- Cabecera del Chat -->
  <div class="p-4 border-b border-slate-150 dark:border-plomo-border flex items-center justify-between shrink-0">
    <div>
      <h3 class="font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
        Asistente de IA UML
      </h3>
      <p class="text-[10px] text-slate-500 dark:text-slate-400 mt-0.5">
        Crea, mueve y edita mediante instrucciones de texto o voz.
      </p>
    </div>
  </div>

  <!-- Contenedor del Historial de Mensajes -->
  <div 
    #scrollContainer 
    class="flex-1 overflow-y-auto p-4 space-y-4 min-h-0 bg-slate-50/50 dark:bg-plomo-strong/30"
  >
    @for (msg of messages(); track $index) {
      <div 
        class="flex flex-col max-w-[85%] animate-fade-in"
        [class.self-end]="msg.role === 'user'"
        [class.ml-auto]="msg.role === 'user'"
        [class.mr-auto]="msg.role === 'assistant'"
        [class.items-end]="msg.role === 'user'"
        [class.items-start]="msg.role === 'assistant'"
      >
        <!-- Nombre del Rol -->
        <span class="text-[9px] font-bold text-slate-400 mb-1">
          {{ msg.role === 'user' ? 'Tú' : 'Agente IA' }}
        </span>

        <!-- Burbuja de Mensaje -->
        <div 
          class="p-3 text-xs leading-relaxed shadow-sm rounded-2xl"
          [class.bg-indigo-600]="msg.role === 'user'"
          [class.text-white]="msg.role === 'user'"
          [class.rounded-tr-none]="msg.role === 'user'"
          [class.bg-white]="msg.role === 'assistant'"
          [class.dark:bg-plomo-hover/80]="msg.role === 'assistant'"
          [class.text-slate-800]="msg.role === 'assistant'"
          [class.dark:text-slate-200]="msg.role === 'assistant'"
          [class.border]="msg.role === 'assistant'"
          [class.border-slate-150]="msg.role === 'assistant'"
          [class.dark:border-plomo-border]="msg.role === 'assistant'"
          [class.rounded-tl-none]="msg.role === 'assistant'"
        >
          <div class="whitespace-pre-wrap font-medium">{{ msg.content }}</div>
        </div>
      </div>
    }

    <!-- Indicador de Carga / Escritura de la IA -->
    @if (isLoading()) {
      <div class="flex flex-col items-start max-w-[80%] mr-auto animate-pulse">
        <span class="text-[9px] font-bold text-slate-400 mb-1">Agente IA</span>
        <div class="p-3 bg-slate-100 dark:bg-plomo-hover/50 rounded-2xl rounded-tl-none border border-slate-200 dark:border-plomo-border/50 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 0ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 150ms"></span>
          <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 300ms"></span>
        </div>
      </div>
    }
  </div>

  <!-- Entrada del Prompt (Mensaje) y Dictado por Voz -->
  <div class="p-4 border-t border-slate-150 dark:border-plomo-border bg-white dark:bg-plomo-card shrink-0">
    <div class="flex items-center gap-2">
      
      <!-- Botón de Micrófono (Dictado) -->
      <button 
        type="button"
        (click)="toggleSpeech()"
        [title]="isListening() ? 'Detener Micrófono' : 'Dictar por Voz'"
        [class.bg-red-500]="isListening()"
        [class.text-white]="isListening()"
        [class.animate-pulse]="isListening()"
        [class.bg-slate-100]="!isListening()"
        [class.hover:bg-slate-200]="!isListening()"
        [class.dark:bg-plomo-hover]="!isListening()"
        [class.dark:hover:bg-plomo-border]="!isListening()"
        [class.text-slate-600]="!isListening()"
        [class.dark:text-slate-300]="!isListening()"
        class="w-10 h-10 rounded-xl transition-all duration-300 flex items-center justify-center shrink-0 border border-transparent dark:border-plomo-border/40"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          @if (isListening()) {
            <!-- Icono Micrófono Activo / Detener -->
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
          } @else {
            <!-- Icono Micrófono Inactivo -->
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
          }
        </svg>
      </button>

      <!-- Input de Texto -->
      <div class="relative flex-1">
        <input 
          type="text" 
          [ngModel]="promptText()"
          (ngModelChange)="promptText.set($event)"
          (keydown.enter)="sendMessage()"
          [disabled]="isLoading() || !editable()"
          placeholder="Escribe un comando o mensaje..."
          class="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-slate-200 dark:border-plomo-border bg-slate-50 dark:bg-plomo-hover text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all focus:outline-none disabled:opacity-50"
        />
        
        <!-- Botón de Enviar dentro del input -->
        <button 
          (click)="sendMessage()"
          [disabled]="!promptText().trim() || isLoading() || !editable()"
          class="absolute right-1.5 top-1.5 w-7 h-7 rounded-lg bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-700 text-white disabled:text-slate-400 dark:disabled:text-slate-500 flex items-center justify-center transition-all"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
          </svg>
        </button>
      </div>

    </div>
  </div>

</div>
