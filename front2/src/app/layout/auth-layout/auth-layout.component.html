<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-plomo-strong transition-all duration-300 relative overflow-hidden">
  <!-- Círculos decorativos con degradado difuso para diseño premium (Wow factor) -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/15 dark:bg-indigo-500/5 rounded-full filter blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-teal-500/15 dark:bg-cyan-500/5 rounded-full filter blur-3xl pointer-events-none"></div>
  
  <!-- Botón de Tema flotante en el Login -->
  <div class="absolute top-6 right-6">
    <button 
      (click)="themeService.toggleTheme()" 
      class="flex items-center justify-center w-10 h-10 rounded-xl bg-white dark:bg-plomo-card border border-slate-200 dark:border-plomo-border text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-plomo-hover transition-all shadow-sm"
      title="Cambiar Tema"
    >
      @if (themeService.theme() === 'light') {
        <!-- Sol SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21M5.25 5.25l1.591 1.591M18.293 18.293l1.59 1.59M3 12h2.25m13.5 0H21M5.25 18.75l1.591-1.591M18.293 6.707l1.59-1.59M12 9a3 3 0 100 6 3 3 0 000-6z" />
        </svg>
      } @else {
        <!-- Luna SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      }
    </button>
  </div>

  <div class="w-full max-w-md p-4 relative z-10 animate-fade-in">
    <router-outlet></router-outlet>
  </div>
</div>
