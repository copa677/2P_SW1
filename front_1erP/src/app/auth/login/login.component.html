<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
      </div>
      <h1>UML Architect</h1>
      <p>Bienvenido de nuevo. Por favor, inicia sesión.</p>
    </div>

    <form (submit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="admin@admin.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="error-message" *ngIf="error()">
        {{ error() }}
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Ingresar</span>
        <span *ngIf="isLoading()" class="loader"></span>
      </button>
    </form>

    <div class="login-footer">
      <p>¿Olvidaste tu contraseña? <a href="#">Contactar soporte</a></p>
    </div>
  </div>
</div>
