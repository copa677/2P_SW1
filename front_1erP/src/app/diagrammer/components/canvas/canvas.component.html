<div class="canvas-container" 
     #canvasContainer
     (dragover)="onDragOver($event)" 
     (drop)="onDrop($event)"
     (mousemove)="onMouseMove($event)"
     (contextmenu)="onContextMenu($event)">
     
  <!-- Capa de Punteros Remotos -->
  <div class="cursor-layer" #cursorLayer *ngIf="diagramService.paper">
    <div *ngFor="let entry of diagramService.collabService.remoteCursors() | keyvalue" 
         class="remote-cursor"
         [style.left.px]="entry.value.x"
         [style.top.px]="entry.value.y"
         [style.color]="entry.value.color">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 2l12 11.23-5.26 1.41 4.54 6.76-2.22 1.34-4.52-6.73-4.54 4.5V2z"/>
      </svg>
      <div class="cursor-label" [style.background-color]="entry.value.color">
        {{ entry.value.username }}
      </div>
    </div>
  </div>

  <div id="paper-element" #paperElement></div>
  
  <!-- Indicador visual de modo paneo -->
  <div class="pan-indicator" *ngIf="isPanning">
      🖱️ Moviendo Pizarra...
  </div>
</div>
