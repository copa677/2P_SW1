<div class="modal-overlay" *ngIf="diagramService.showProperties()" (click)="diagramService.closeProperties()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="header-info">
        <span class="type-badge">{{ diagramService.selectedCell()?.get('type') || 'Elemento' }}</span>
        <h3>Propiedades</h3>
      </div>
      <button class="close-btn" (click)="diagramService.closeProperties()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body" *ngIf="diagramService.selectedCell() as cell">
      <div class="form-group" *ngIf="!cell.isLink()">
        <label>Etiqueta / Texto</label>
        <input type="text" [ngModel]="cell.attr('label/text')" (ngModelChange)="onLabelChange($event)"
          placeholder="Ingrese el nombre del paso...">
      </div>

      <div class="form-group" *ngIf="!cell.isLink() && !cell.get('isSwimlane')">
        <label>Color de fondo</label>
        <div class="color-picker-grid">
          <button *ngFor="let color of colors" [style.background-color]="color" (click)="onColorChange(color)"
            class="color-btn" [class.active]="cell.attr('body/fill') === color">
          </button>
        </div>
      </div>

      <div class="form-group" *ngIf="cell.get('isSwimlane')">
        <label>Color del Carril</label>
        <input type="color" [ngModel]="cell.attr('body/fill')" (ngModelChange)="onColorChange($event)">
      </div>

      <div class="form-group">
        <label>Descripción / Regla de Negocio</label>
        <textarea rows="3" placeholder="Describa la lógica detallada aquí..."></textarea>
      </div>

      <!-- Sección de Acción de Negocio -->
      <div class="business-action-section" *ngIf="!cell.isLink() && !cell.get('isSwimlane')">
        <h4 class="section-title">Vinculación de Proceso</h4>

        <div class="form-group">
          <label>Tipo de Acción</label>
          <select [ngModel]="getActionType()" (ngModelChange)="onActionTypeChange($event)" class="select-input">
            <option value="none">Sin acción externa</option>
            <option value="form">📝 Formulario de Datos</option>
            <option value="signature">✍️ Firma Digital</option>
            <option value="sello">🏷️ Sello Oficial</option>
          </select>
        </div>

        <!-- Constructor de Formulario -->
        <div class="form-builder-container" *ngIf="getActionType() === 'form'">
          <div class="builder-header">
            <h5 class="builder-title">Configuración de Campos</h5>
            <button class="btn-add-field" (click)="addFormField()">
              <span>➕</span> Añadir Campo
            </button>
          </div>

          <div class="fields-list">
            <div class="field-item" *ngFor="let field of getFormFields(); let i = index">
              <div class="field-row">
                <input type="text" [(ngModel)]="field.label" (ngModelChange)="onFieldChange()"
                  placeholder="Etiqueta del campo" class="field-input">
                <button class="btn-remove-field" (click)="removeFormField(i)">✕</button>
              </div>
              <div class="field-row-secondary">
                <select [(ngModel)]="field.type" (ngModelChange)="onFieldChange()" class="field-select">
                  <option value="text">Texto</option>
                  <option value="number">Número</option>
                  <option value="date">Fecha</option>
                  <option value="select">Combo / Lista</option>
                  <option value="checkbox">Checkbox</option>
                </select>
                <label class="field-checkbox">
                  <input type="checkbox" [(ngModel)]="field.required" (ngModelChange)="onFieldChange()">
                  <span>Requerido</span>
                </label>
              </div>
            </div>
          </div>

          <div class="empty-state" *ngIf="getFormFields().length === 0">
            No hay campos definidos. Pulsa "Añadir Campo" para empezar.
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-delete" (click)="deleteElement()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          Eliminar Elemento
        </button>
      </div>
    </div>
  </div>
</div>
